<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
<title id="title">Taken Group Research Agent Architecture</title>
<desc id="desc">Source documents feed extraction and persistent dense and lexical indexes. Heuristic routing guides a LangGraph workflow from retrieval to planning and research with optional implementation mapping before review. Cross encoder reranking is an optional dense search API branch. Evaluation records metrics including Recall at K and source grounded faithfulness alongside research proposals.</desc>
